name: SFOD-RS GPU Test

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show working directory
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          ls -la

      - name: Check NVIDIA GPU
        run: |
          nvidia-smi

      - name: Check Python environment
        run: |
          /home/wentiezhen/miniconda3/envs/sfod/bin/python --version
          /home/wentiezhen/miniconda3/envs/sfod/bin/python -c "
          import torch
          print('PyTorch:', torch.__version__)
          print('CUDA available:', torch.cuda.is_available())
          print('CUDA Runtime:', torch.version.cuda)
          print('GPU:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'N/A')
          "

      - name: Show repository files
        run: |
          cd "$GITHUB_WORKSPACE"
          pwd
          find . -maxdepth 2 -type f | head -100

      - name: Run SFOD-RS test
        run: |
          cd "$GITHUB_WORKSPACE"
          /home/wentiezhen/miniconda3/envs/sfod/bin/python test.py
